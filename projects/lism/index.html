<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiSM</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      main {
        /* Type, logo, marks and spacing share one unit. --s is 1rem up to about 1280x950; beyond that
           it grows at half the window's rate, up to 1.5rem, so large screens get larger type. Growing
           more slowly than the window is what lets browser zoom still enlarge the page: zooming
           shrinks the window the page sees, and a unit that followed the window fully would cancel it. */
        --s: clamp(1rem, .5rem + min(100dvh / 118.75, 100vw / 160), 1.5rem);
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        font-family: "Source Sans 3", Arial, sans-serif;
        font-weight: 600;
      }
      /* Base layout, for narrow windows: one centred column that scrolls. */
      header { display: grid; padding-bottom: calc(1.5 * var(--s)); }
      .logo-stage { position: relative; display: grid; place-items: center; margin: 0; padding-block: calc(2 * var(--s)) calc(1.25 * var(--s)); }
      .logo-stage img { width: min(60vw, calc(25 * var(--s))); }
      .logo-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .authors { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(.25 * var(--s)) 2em; margin: 0; padding: calc(.25 * var(--s)) var(--s) calc(.5 * var(--s)); list-style: none; font-size: calc(1.125 * var(--s)); line-height: 1.25; text-align: center; }
      /* The first author's name leads back to the homepage. It looks like the other names until pointed at. */
      .authors a { text-decoration: none; transition: opacity 120ms ease-out; }
      @media (hover: hover) { .authors a:hover { opacity: .6; } }
      .authors a:active { opacity: .4; }
      .authors a:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
      /* Links are a step smaller than the names and set apart from them. */
      .resources { display: flex; justify-content: center; gap: calc(.6 * var(--s)); margin-top: calc(.75 * var(--s)); font-size: var(--s); }
      /* Outlined blocks in the logo's black; they fill in when pointed at. */
      .resources a {
        padding: calc(.35 * var(--s)) calc(.9 * var(--s));
        box-shadow: inset 0 0 0 1.5px #111;
        color: #111;
        line-height: 1.25;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 120ms ease-out, color 120ms ease-out, transform 80ms ease-out;
      }
      @media (hover: hover) { .resources a:hover { background: #111; color: #fff; } }
      .resources a:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
      .resources a:active { transform: translateY(1px); }
      @media (prefers-reduced-motion: reduce) { .resources a { transition: none; } }
      .panels { display: grid; border-block: 1px solid; }
      .panels > * { display: grid; container-type: inline-size; grid-template-rows: auto clamp(calc(1.8 * var(--s)), 2.5vw, calc(3.6 * var(--s))) minmax(calc(12 * var(--s)), 1fr); --gutter: clamp(calc(1.5 * var(--s)), 5vw, calc(3 * var(--s))); padding: var(--gutter) max(var(--gutter), calc((100% - 46 * var(--s)) / 2)) calc(2 * var(--s)); }
      .gallery { border-top: 1px solid; }
      .panels > a { text-decoration: none; }
      .panels > a:focus-visible { outline: 2px solid currentColor; outline-offset: -3px; }
      h2, .edition { margin: 0; }
      .panels .paper {
        font-family: "Source Serif 4", Georgia, serif;
      }
      .paper svg, .composition {
        grid-row: 3;
        place-self: center;
        width: min(100%, 60svh);
        aspect-ratio: 1;
        margin-top: var(--s);
      }
      /* Sized to fit the panel; as a safety net (a stale size right after zooming, say) a title is
         clipped at the panel's edge instead of widening the panel or running into its neighbour. */
      h2 { font-size: min(8.4cqi, calc(7 * var(--s))); font-weight: inherit; line-height: 1.12; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding-bottom: .12em; margin-bottom: -.12em; }
      .gallery h2 { font-family: "Clash Display", sans-serif; font-weight: 500; }
      .composition {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 2px;
      }
      .composition img { display: block; width: 100%; }
      .composition > span { position: relative; }
      .pose-overlay { position: absolute; inset: 0; opacity: 0; filter: drop-shadow(0 0 1px #111); }
      @media (hover: hover) and (pointer: fine) {
        .composition > span:hover .pose-overlay { opacity: 1; }
      }
      .edition { margin-top: 0.5em; font-size: clamp(var(--s), 3.5cqi, calc(2 * var(--s))); font-style: italic; }
      /* Acknowledgements are logos only: school and lab on one row, funders on another. */
      footer, .credit-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(.75 * var(--s)) calc(1.5 * var(--s)); }
      footer { padding: var(--s); }
      footer a { display: block; text-decoration: none; }
      footer img { display: block; width: auto; height: var(--mark, calc(2 * var(--s))); }
      /* Sized by eye: each mark is as tall as its smallest text needs. */
      .mark-meduni { --mark: calc(1.9 * var(--s)); }
      .mark-cd { --mark: calc(2.75 * var(--s)); }
      .mark-erc { --mark: calc(3.5 * var(--s)); }
      .lab-wordmark {
        color: #16191d;
        font: 700 calc(1.375 * var(--s))/1.1 Arial, sans-serif;
        letter-spacing: -.04em;
        white-space: nowrap;
      }
      /* The lab's own site sets "Lab" in this blue. */
      .lab-wordmark span { color: #1a5f92; }
      @media (max-width: 600px) {
        .authors { display: grid; grid-template-columns: auto auto; }
      }
      /* From 1100px wide: no header band. Everything about the work sits in a left column (logo, authors
         and links at the top; school, lab and funders at the foot) and the panels fill the rest of one
         screen. The layout never depends on the window's height: a window too short for the column
         scrolls instead. The logo's stage is the top of the column, so the ball rolls in from the
         column's right edge. */
      @media (min-width: 1100px) {
        main {
          --pad: calc(2 * var(--s));
          /* Sized by --s, so the column and its logo grow with zoom; never narrower than the three
             links, or the school and lab, on one line. */
          --side: clamp(calc(23.5 * var(--s)), 42vw, calc(27 * var(--s)));
          --logo-w: calc(var(--side) - 2 * var(--pad));
          --logo-h: calc(var(--logo-w) * 160 / 390);
          /* The column's own height: the logo plus the fixed rows around it. */
          --column: calc(var(--logo-h) + 24.5 * var(--s));
          height: max(100dvh, var(--column));
          grid-template-columns: var(--side) minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
        }
        header { grid-area: 1 / 1; display: flex; flex-direction: column; min-height: 0; padding: 0; }
        footer { grid-area: 2 / 1; flex-direction: column; align-items: flex-start; gap: calc(1.1 * var(--s)); padding: var(--pad); }
        .logo-stage { padding: calc(2.5 * var(--s)) var(--pad) calc(1.75 * var(--s)); justify-items: start; }
        .logo-stage img { width: var(--logo-w); }
        .authors { display: grid; justify-content: start; justify-items: start; gap: calc(.2 * var(--s)); padding: 0 var(--pad); text-align: left; }
        .resources { justify-content: flex-start; margin-top: calc(1.5 * var(--s)); padding: 0 var(--pad); }
        .credit-row { justify-content: flex-start; }
        .credit-home { gap: calc(.75 * var(--s)) calc(1.1 * var(--s)); }
        .mark-cd { --mark: calc(2.4 * var(--s)); }
        .mark-erc { --mark: calc(3 * var(--s)); }
        /* Squarer windows: paper above gallery. */
        .panels { grid-area: 1 / 2 / span 2; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); border-block: 0; border-left: 1px solid; }
        .panels > * {
          grid-template-rows: auto calc(.75 * var(--s)) minmax(0, 1fr);
          padding: min(4vw, 3.5dvh) clamp(calc(1.5 * var(--s)), 3vw, calc(4 * var(--s))) var(--s);
        }
        /* Titles and figures follow the panel's height here, not its width. Titles also stop at 4 units,
           so that zooming out shrinks them along with the column's text. */
        h2 { font-size: min(8.4cqi, calc(4 * var(--s)), 7.5dvh); }
        .edition { font-size: min(clamp(var(--s), 3.5cqi, calc(2 * var(--s))), 3.2dvh); }
        .paper svg, .composition { width: auto; height: min(calc(100% - var(--s)), 100cqi); min-width: 0; min-height: 0; margin-top: 0; }
      }
      /* Wider than 4:3: paper and gallery side by side. Around that shape the two arrangements give
         figures of about the same size, so this is where they swap. */
      @media (min-width: 1100px) and (min-aspect-ratio: 4/3) {
        .panels { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); }
        .panels > * { grid-template-rows: auto clamp(calc(1.8 * var(--s)), 2.5vw, calc(3.6 * var(--s))) minmax(0, 1fr); }
        .gallery { border-top: 0; border-left: 1px solid; }
      }
      /* Short windows: the column tightens before the page has to scroll. */
      @media (min-width: 1100px) and (max-height: 620px) {
        main {
          --logo-w: min(calc(var(--side) - 2 * var(--pad)), max(52dvh, calc(18 * var(--s))));
          --column: calc(var(--logo-h) + 17.25 * var(--s));
        }
        .logo-stage { padding-block: calc(1.5 * var(--s)) var(--s); }
        .authors { grid-template-columns: auto auto; column-gap: 2em; }
        .resources { margin-top: var(--s); }
        footer { gap: calc(.8 * var(--s)); padding-block: calc(1.25 * var(--s)); }
      }
      /* The gallery title hugs its text, so composition.js can carry it onto the gallery's heading. */
      .gallery h2 { justify-self: start; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 class="logo-stage"><img src="/projects/lism/logo.svg" alt="LiSM" /></h1>
        <ul class="authors" aria-label="Authors">
          <li><a href="/" aria-label="Pengwei Wang, homepage">Pengwei Wang</a></li>
          <li>José Morano</li>
          <li>Botond Fazekas</li>
          <li>Hrvoje Bogunović</li>
        </ul>
        <div class="resources">
          <a href="https://arxiv.org/abs/2611.33037">arXiv</a>
          <a href="https://github.com/penway/LiSM">GitHub</a>
          <a href="https://huggingface.co/penway47/LiSM">Hugging Face</a>
        </div>
      </header>
      <div class="panels">
        <a class="paper" href="./paper/" aria-labelledby="paper-title">
          <h2 id="paper-title">Linear Probes can Guide</h2>
          <p class="edition">Director’s Cut: an HTML paper</p>
          <svg viewBox="0 -11.25 335 335" role="img" aria-label="LiSM trajectory through projected cat and dog features"></svg>
        </a>
        <a class="gallery" href="./gallery/">
          <h2>Gallery</h2>
          <div class="composition" aria-hidden="true"></div>
        </a>
      </div>
      <footer aria-label="Affiliation and funding">
        <div class="credit-row credit-home">
          <a class="mark-meduni" href="https://www.meduniwien.ac.at"><img src="/logos/meduni-wien.svg" width="356" height="76" alt="Medical University of Vienna" /></a>
          <a class="lab-wordmark" href="https://bogunovic-lab.cynapse.at">Bogunović <span>Lab</span></a>
        </div>
        <div class="credit-row credit-funding">
          <a class="mark-cd" href="https://www.cdg.ac.at"><img src="/logos/cd-forschungsgesellschaft.png" width="560" height="237" alt="Christian Doppler Forschungsgesellschaft" /></a>
          <a class="mark-erc" href="https://erc.europa.eu"><img src="/logos/erc-eu.png" width="640" height="276" alt="Funded by the European Union, European Research Council" /></a>
        </div>
      </footer>
    </main>
    <script type="module">
      import "./probe-figure.js";
      import "./composition.js";
      import "@fontsource/source-sans-3/latin-600.css";
      import "@fontsource/source-serif-4/latin-600.css";
      import "@fontsource/source-serif-4/latin-600-italic.css";

      async function playLogo() {
        const stage = document.querySelector(".logo-stage");
        const mark = stage.querySelector("img");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const { create } = await import("./logo-scene.js");
        const canvas = document.createElement("canvas");
        canvas.setAttribute("aria-hidden", "true");
        const logo = create({
          canvas, width: stage.clientWidth, height: stage.clientHeight,
          markWidth: () => mark.getBoundingClientRect().width, setStyle: false,
          // The mark is centred on tall windows and sits at the left on wide ones.
          centerX: () => {
            const box = mark.getBoundingClientRect();
            return (box.left + box.width / 2 - stage.getBoundingClientRect().left) / stage.clientWidth;
          },
          // The stage has more room above the mark than below, so the mark is not at its middle.
          centerY: () => {
            const box = mark.getBoundingClientRect();
            return (box.top + box.height / 2 - stage.getBoundingClientRect().top) / stage.clientHeight;
          },
        });
        logo.startX = logo.offscreenStartX();
        logo.render(0, "anim");
        mark.after(canvas);
        const refit = () => logo.resize(stage.clientWidth, stage.clientHeight);
        const observer = new ResizeObserver(refit);
        observer.observe(stage);
        // Zoom can change the pixel density without changing the stage's size.
        addEventListener("resize", refit);
        // The last frame is the flat logo, drawn as a raster. Hand over to the SVG underneath, which
        // stays sharp at any zoom: fade the canvas out and remove it.
        function handOver() {
          observer.disconnect();
          removeEventListener("resize", refit);
          canvas.animate({ opacity: [1, 0] }, { duration: 200, easing: "ease-out" }).finished
            .then(() => canvas.remove());
        }
        const start = performance.now();
        function frame(now) {
          const t = (now - start) / 1000;
          if (t >= logo.END) {
            logo.render(logo.END, "rest");
            handOver();
            return;
          }
          logo.render(t, "anim");
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      playLogo().catch(() => { /* The static SVG is visible without WebGL. */ });
    </script>
  </body>
</html>
